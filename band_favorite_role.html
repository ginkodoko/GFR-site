ring:auto;-webkit-transform:translateZ(0);transform:translateZ(0)}.role-modal-name{font-size:14px;font-weight:900}.role-modal-role{font-size:11px;color:#777;margin-top:5px}.role-modal-band{font-size:10px;color:#999;margin-top:5px}@media(max-width:600px){.role-dialog-list{grid-template-columns:1fr}}

<div class="app"><header><div class="actions"><button id="randomBtn">全部随机</button><button id="resetBtn">恢复默认</button><button class="primary" id="pngBtn">导出 PNG</button></div></header>
<aside class="left"><div class="section"><h2>页面设置</h2><label>填表人</label><input id="titleInput" type="text" placeholder="名字"></div><div class="section"><h2>五个角色位置</h2><div class="slot-list" id="slotList"></div></div></aside>
<main class="center"><div class="preview"><h1 class="title" id="previewTitle"></h1><div class="grid" id="grid"></div><div class="preview-note">乐队名称已替换为可插入图片 LOGO 的区域。</div></div></main>
<aside class="right" id="inspector"></aside></div><div class="role-modal" id="roleModal"><div class="role-dialog"><div class="role-dialog-head"><div class="role-dialog-title" id="roleModalTitle">选择角色</div><button type="button" class="role-dialog-close" id="roleModalClose">关闭</button></div><div class="role-dialog-list" id="roleModalList"></div></div></div>
<script>
const FIXED_LOGOS=["./images/img_0630ddca090bbd6e.png","images/img_fb7e35b6140f947b.png","images/img_ada8197b8f7e19bd.png","images/img_13185af10feeac5d.png","images/img_7a9fcbf23b6c608e.png"];
const DATA={"characters":[{"id":"nina_iseri","band":"TOGENASHI TOGEARI","name":"井芹仁菜","role":"Vo.","theme":"#53B8E8","image":"./images/img_29e2906b764f6bc6.png"},{"id":"momoka_kawaragi","band":"TOGENASHI TOGEARI","name":"河原木桃香","role":"Gt.","theme":"#53B8E8","image":"./images/img_a893a0d70b70e986.png"},{"id":"subaru_awa","band":"TOGENASHI TOGEARI","name":"安和昴","role":"Dr.","theme":"#53B8E8","image":"./images/img_764c1c86b22bdf8a.png"},{"id":"tomo_ebizuka","band":"TOGENASHI TOGEARI","name":"海老塚智","role":"Key.","theme":"#53B8E8","image":"./images/img_f8cc19e765845ef9.png"},{"id":"rupa","band":"TOGENASHI TOGEARI","name":"Rupa","role":"Ba.","theme":"#53B8E8","image":"./images/img_48bb3273626e6dae.png"},{"id":"hina","band":"DIAMOND DUST","name":"HINA","role":"Vo.Gt.","theme":"#53B8E8","image":"./images/img_5f5ef9f2dfd61cae.png"},{"id":"nana","band":"DIAMOND DUST","name":"NANA","role":"Ba.","theme":"#53B8E8","image":"./images/img_2d3b1766acb82c0e.png"},{"id":"rin","band":"DIAMOND DUST","name":"RIN","role":"Gt.","theme":"#53B8E8","image":"./images/img_ed968d3abbfe8f8d.png"},{"id":"ai","band":"DIAMOND DUST","name":"AI","role":"Dr.","theme":"#53B8E8","image":"./images/img_c179c02679972009.png"},{"id":"kaede_kitsuta","band":"CANNA LILY","name":"橘田枫","role":"Vo.","theme":"#53B8E8","image":"./images/img_a22c48f05cdc5390.png"},{"id":"ayame_hoshi","band":"CANNA LILY","name":"星亚矢芽","role":"Gt.","theme":"#53B8E8","image":"./images/img_135909cd8fc8096d.png"},{"id":"rindo_chigasaki","band":"CANNA LILY","name":"千崎龙胆","role":"Dr.","theme":"#53B8E8","image":"./images/img_baecc0871994b60e.png"},{"id":"shion_sasakibara","band":"CANNA LILY","name":"榊原紫苑","role":"Ba.","theme":"#53B8E8","image":"./images/img_6394975d0c6237bb.png"},{"id":"nazuna_yukishima","band":"CANNA LILY","name":"雪志摩荠","role":"Key.","theme":"#53B8E8","image":"./images/img_80c936f1a43a61f0.png"},{"id":"ari_nakamura","band":"F-272","name":"中村有","role":"Dr.","theme":"#53B8E8","image":"./images/img_8c1d06b0cac5140d.png"},{"id":"koto_udagawa","band":"F-272","name":"宇田川琴","role":"Gt.","theme":"#53B8E8","image":"./images/img_be9f9d193b8b539d.png"},{"id":"hazuki_kuromiya","band":"F-272","name":"黑宫八月","role":"Gt.","theme":"#53B8E8","image":"./images/img_8ce5a4fa09268311.png"},{"id":"momono_asai","band":"F-272","name":"浅井萌萌乃","role":"Ba.","theme":"#53B8E8","image":"./images/img_30c464d9017a6cbb.png"},{"id":"saki_kato","band":"F-272","name":"加藤嗄生","role":"Vo.","theme":"#53B8E8","image":"./images/img_4b1b626a7aeaaedd.png"},{"id":"wakaba_wakahori","band":"クズミミズク","name":"若堀若叶","role":"Vo.Gt.","theme":"#53B8E8","image":"./images/img_f50113183d28534f.png"},{"id":"su_iitoyo","band":"クズミミズク","name":"饭丰澄羽","role":"Gt.Vo.","theme":"#53B8E8","image":"./images/img_444cb4ea6fb22cf9.png"},{"id":"karuta_otozu","band":"クズミミズク","name":"乙津歌留多","role":"Ba.","theme":"#53B8E8","image":"./images/img_2b5bdcd0ca9ff64e.png"},{"id":"fuka_ustugi","band":"クズミミズク","name":"卯木风薰","role":"Dr.","theme":"#53B8E8","image":"./images/img_dc97fe008c9f1cde.png"},{"id":"shino_yatsumine","band":"クズミミズク","name":"八峰志乃","role":"Key.","theme":"#53B8E8","image":"./images/img_a350272ebd995803.png"}]};
CHARS=Object.fromEntries(DATA.characters.map(c=>[c.id,c]));
const SLOT_BANDS=["TOGENASHI TOGEARI","DIAMOND DUST","CANNA LILY","F-272","クズミミズク"];
function buildSlotOptions(i){return DATA.characters.filter(c=>c.band===SLOT_BANDS[i]).map(c=>c.id);}
const defaults=Array.from({length:5},(_,i)=>{const options=buildSlotOptions(i); return {label:"位置 "+(i+1),default:options[0]||null,options,fixedLogo:FIXED_LOGOS[i]};});
let state={title:"",titleSize:40,titleFont:"Arial",titleWeight:900,titleColor:"#000000",titleItalic:false,titleSpacing:0,titleAlign:"center",gap:12,radius:9,accent:"#df3673",slots:defaults,selected:defaults.map(s=>s.default)},activeSlot=0;
function esc(v){return String(v).replace(/[&<>"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[m]))}
function logoFor(i,id){return state.slots[i].fixedLogo||FIXED_LOGOS[i]||""}
function save(){localStorage.setItem("fiveSlotLogoEditor",JSON.stringify({state:state,characters:DATA.characters}))}
function load(){
  try{
    let x=JSON.parse(localStorage.getItem("fiveSlotLogoEditor"));
    if(x&&x.state&&x.state.slots?.length===5){
      state=x.state;
      if(Array.isArray(x.characters)){
        const merged=[...x.characters];
        DATA.characters.forEach(c=>{ if(!merged.some(v=>v.id===c.id)) merged.push(c); });
        DATA.characters.splice(0,DATA.characters.length,...merged);
        Object.keys(CHARS).forEach(k=>delete CHARS[k]);
        DATA.characters.forEach(c=>CHARS[c.id]=c);
      }
    }
    state.slots=Array.from({length:5},(_,i)=>{
      const options=DATA.characters.filter(c=>c.band===SLOT_BANDS[i]).map(c=>c.id);
      const old=state.slots?.[i]||{};
      const validOld=(old.options||[]).filter(id=>CHARS[id]&&CHARS[id].band===SLOT_BANDS[i]);
      const merged=[...options,...validOld.filter(id=>!options.includes(id))];
      return {label:"位置 "+(i+1),default:merged[0]||null,options:merged,fixedLogo:FIXED_LOGOS[i]};
    });
    state.selected=state.slots.map((slot,i)=>{ const old=state.selected?.[i]; return old&&slot.options.includes(old)?old:slot.default; });
  }catch(e){
    state={title:"",titleSize:40,titleFont:"Arial",titleWeight:900,titleColor:"#000000",titleItalic:false,titleSpacing:0,titleAlign:"center",gap:12,radius:9,accent:"#df3673",slots:defaults,selected:defaults.map(s=>s.default)};
  }
}
function render(){
  titleInput.value=state.title||"";
  document.documentElement.style.setProperty("--accent",state.accent);
  previewTitle.textContent=(state.title||"")+"的GFR乐队最爱角色";
  previewTitle.style.fontSize="40px";
  previewTitle.style.color="#000000";
  previewTitle.style.fontFamily='Arial, sans-serif';
  previewTitle.style.fontWeight="900";
  previewTitle.style.fontStyle="normal";
  previewTitle.style.letterSpacing="0";
  previewTitle.style.textAlign="center";
  grid.innerHTML="";
  state.selected.forEach((id,i)=>{
    let c=id?CHARS[id]:null,logo=logoFor(i,id),e=document.createElement("div");
    e.className="card"+(i===activeSlot?" active":"");
    e.style.borderRadius=state.radius+"px";
    e.onclick=()=>{activeSlot=i;render();inspect()};
    e.innerHTML=c?`<img class="character" src="${c.image}"><div class="logo-box">${logo?`<img src="${logo}">`:`<span class="logo-placeholder">未设置 LOGO</span>`}</div><div class="info"><div class="name">${esc(c.name)}</div><div class="role">${esc(c.role||"")}</div></div>`:`<div class="character" style="display:flex;align-items:center;justify-content:center;background:#f5f5f5;color:#aaa;font-size:13px">暂无角色</div><div class="logo-box">${logo?`<img src="${logo}">`:`<span class="logo-placeholder">未设置 LOGO</span>`}</div><div class="info"><div class="name">位置 ${i+1}</div><div class="role">${esc(SLOT_BANDS[i])}</div></div>`;
    grid.appendChild(e);
  });
  slotList.innerHTML=state.slots.map((s,i)=>{
    const selected=state.selected[i];
    const current=CHARS[selected];
    return `<div class="slot-item ${i===activeSlot?'active':''}" data-i="${i}"><strong>位置 ${i+1} · ${esc(SLOT_BANDS[i])}</strong><div class="role-picker" data-i="${i}"><button type="button" class="role-picker-btn"><span class="role-picker-thumb">${current?`<img src="${current.image}" style="width:100%;height:100%;object-fit:cover;border-radius:4px">`:''}</span><span class="role-picker-info"><span class="role-picker-name">${esc(current?.name||'请选择角色')}</span><span class="role-picker-role">${esc(current?.role||'')}</span></span><span class="role-picker-arrow">选择 ▾</span></button></div></div>`;
  }).join('');
  save();
}
// 使用事件委托：角色按钮在 render() 中会反复重建，因此不把点击事件绑定在旧按钮上。
const slotListEl=document.getElementById('slotList');
slotListEl.addEventListener('click',e=>{
  const btn=e.target.closest('.role-picker-btn');
  const item=e.target.closest('.slot-item');
  if(btn && item){
    e.preventDefault();
    e.stopPropagation();
    activeSlot=Number(item.dataset.i);
    openRoleModal(activeSlot);
    return;
  }
  if(item){
    activeSlot=Number(item.dataset.i);
    render();
    inspect();
  }
});

function openRoleModal(i){
  const modal=document.getElementById('roleModal'), list=document.getElementById('roleModalList'), title=document.getElementById('roleModalTitle');
  const band=SLOT_BANDS[i]; const selected=state.selected[i];
  title.textContent=`位置 ${i+1} · 选择角色`;
  const opts=state.slots[i].options.filter(x=>CHARS[x]&&CHARS[x].band===band);
  list.innerHTML=opts.map(x=>{const q=CHARS[x];return `<button type="button" class="role-modal-option ${x===selected?'active':''}" data-id="${esc(x)}"><img src="${q.image}"><span><span class="role-modal-name">${esc(q.name)}</span><span class="role-modal-role">担当：${esc(q.role||'')}</span><span class="role-modal-band">${esc(q.band)}</span></span></button>`}).join('');
  list.querySelectorAll('.role-modal-option').forEach(el=>el.addEventListener('click',()=>{state.selected[i]=el.dataset.id;activeSlot=i;closeRoleModal();render();inspect();}));
  modal.classList.add('open');
}
function closeRoleModal(){document.getElementById('roleModal').classList.remove('open');}
document.getElementById('roleModalClose').onclick=closeRoleModal;
document.getElementById('roleModal').addEventListener('click',e=>{if(e.target.id==='roleModal')closeRoleModal();});
document.addEventListener('keydown',e=>{if(e.key==='Escape')closeRoleModal();});
function inspect(){
  let s=state.slots[activeSlot],id=state.selected[activeSlot],c=CHARS[id],logo=logoFor(activeSlot,id);
  const band=SLOT_BANDS[activeSlot];
  const opts=s.options.filter(x=>CHARS[x]&&CHARS[x].band===band);
  inspector.innerHTML=`<h2>位置 ${activeSlot+1} · ${esc(band)}</h2>
  <div class=section><label>当前角色</label><div class=small>${c?esc(c.name):"尚未选择角色"}</div></div>
  <div class=section><h2>这个位置的固定乐队 LOGO</h2><div class=help>LOGO 与位置绑定，切换角色时不会改变。</div><div class=logo-preview>${logo?`<img src="${logo}">`:`<span>未设置 LOGO</span>`}</div></div>
  <div class=section><h2>选择角色</h2><div class=help>这里只显示 ${esc(band)} 的角色。</div><div class=option-grid id=optionGrid></div></div>`;
  const box=optionGrid;
  if(!opts.length){box.innerHTML='<div class="help" style="grid-column:1/-1;padding:8px 0">角色库中暂时没有这个乐队的角色。请先在 Excel 角色库中补充。</div>';return;}
  opts.forEach(x=>{let q=CHARS[x],e=document.createElement("div");e.className="option"+(id===x?" active":"");e.onclick=()=>{state.selected[activeSlot]=x;render();inspect()};e.innerHTML=`<img src="${q.image}"><div>${esc(q.name)}</div>`;box.appendChild(e);});
}
async function loadImg(src){
  return await new Promise((resolve,reject)=>{
    const i=new Image();

async function downloadCanvasPNG(canvas,filename){return new Promise((resolve,reject)=>{canvas.toBlob(blob=>{if(!blob){reject(new Error('PNG生成失败'));return}const url=URL.createObjectURL(blob);const a=document.createElement('a');a.download=filename;a.href=url;a.style.display='none';document.body.appendChild(a);a.click();setTimeout(()=>{URL.revokeObjectURL(url);a.remove();resolve()},100) },'image/png')})}
function rr(ctx,x,y,w,h,r){r=Math.min(r,w/2,h/2);ctx.beginPath();ctx.moveTo(x+r,y);ctx.arcTo(x+w,y,x+w,y+h,r);ctx.arcTo(x+w,y+h,x,y+h,r);ctx.arcTo(x,y+h,x,y,r);ctx.arcTo(x,y,x+w,y,r);ctx.closePath()}

 for(let i=0;i<5;i++){let col=i%cols,row=Math.floor(i/cols),x=pad+col*(cardW+gap),y=pad+titleH+row*(cardH+rowGap),c=state.selected[i]?CHARS[state.selected[i]]:null,logo=logoFor(i,state.selected[i]);ctx.save();rr(ctx,x,y,cardW,cardH,state.radius);ctx.clip();if(c){let im=await loadImg(c.image);ctx.drawImage(im,x,y,cardW,picH);}else{ctx.fillStyle="#f5f5f5";ctx.fillRect(x,y,cardW,picH);ctx.fillStyle="#aaa";ctx.font="26px Arial";ctx.textAlign="center";ctx.fillText("暂无角色",x+cardW/2,y+picH/2);}ctx.fillStyle="#fff";ctx.fillRect(x,y+picH,cardW,logoH);if(logo){let li=await loadImg(logo),r=Math.min(cardW*.88/li.width,logoH*.78/li.height),lw=li.width*r,lh=li.height*r;ctx.drawImage(li,x+(cardW-lw)/2,y+picH+(logoH-lh)/2,lw,lh)}else{ctx.fillStyle="#aaa";ctx.font="18px sans-serif";ctx.fillText("LOGO",x+cardW/2,y+picH+logoH/2+6)}ctx.fillStyle="#fff";ctx.fillRect(x,y+picH+logoH,cardW,infoH);ctx.fillStyle="#222";ctx.font="800 21px Arial";ctx.fillText(c.name,x+cardW/2,y+picH+logoH+29);ctx.fillStyle="#888";ctx.font="13px sans-serif";ctx.fillText(c.role,x+cardW/2,y+picH+logoH+50);ctx.restore();ctx.strokeStyle="#ddd";rr(ctx,x,y,cardW,cardH,state.radius);ctx.stroke()}
 await downloadCanvasPNG(cv,"gfrbandsuki.png")
